[pytest]
testpaths = tests
addopts = --strict-markers --html=reports/report.html --self-contained-html
markers =
    smoke: quick checks that the device is alive
    regression: full set that protects existing behavior
    negative: invalid inputs and expected errors
log_level = INFO
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %H:%M:%S